<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Document — {{.SchoolName}}</title>
  <meta name="description" content="Verify the authenticity of a document issued by {{.SchoolName}}." />
  <meta name="csrf-token" content="{{.CSRFToken}}" />
  <link rel="stylesheet" href="/static/css/app.css" />
</head>
<body class="bg-background text-text-primary font-body antialiased min-h-screen flex flex-col">

  <header class="bg-white border-b border-neutral-100 py-4">
    <div class="max-w-[1440px] mx-auto px-6 lg:px-12 flex items-center justify-between">
      <a href="/" class="flex items-center gap-3" aria-label="{{.SchoolName}} home">
        {{if .SchoolLogoURL}}<img src="{{.SchoolLogoURL}}" alt="" class="h-10 w-10 object-contain rounded-lg" width="40" height="40" aria-hidden="true" />{{end}}
        <span class="font-display font-bold text-lg text-primary">{{.SchoolName}}</span>
      </a>
    </div>
  </header>

  <main class="flex-1 flex items-center justify-center pt-24 pb-16 px-6" id="main-content">
    <div class="w-full max-w-lg">
      <div class="text-center mb-10">
        <div class="inline-flex items-center justify-center w-16 h-16 bg-accent/10 rounded-2xl mb-4" aria-hidden="true">
          <svg class="w-8 h-8 text-accent" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
        </div>
        <h1 class="font-display font-bold text-2xl text-primary mb-2">Document Verification</h1>
        <p class="text-text-secondary">Enter the reference number printed on your document to verify its authenticity.</p>
      </div>

      <div class="bg-white rounded-2xl border border-neutral-100 shadow-card p-8">
        <form id="verify-form" novalidate>
          <div class="mb-6">
            <label for="doc-ref" class="block text-sm font-semibold text-text-primary mb-2">Document Reference Number</label>
            <input
              type="text"
              id="doc-ref"
              name="doc_ref"
              placeholder="e.g. RES-2025-A3F9B21C"
              class="w-full px-4 py-3 rounded-xl border border-neutral-200 bg-background text-text-primary font-mono text-sm focus:outline-none focus:ring-2 focus:ring-accent focus:border-transparent transition-all placeholder:text-text-secondary/50 uppercase"
              autocomplete="off"
              spellcheck="false"
              aria-describedby="doc-ref-hint"
            />
            <p id="doc-ref-hint" class="mt-2 text-xs text-text-secondary">The reference number is printed at the bottom of every official document.</p>
          </div>
          <button type="submit" id="verify-btn" class="w-full flex items-center justify-center gap-2 bg-accent text-white font-semibold py-3.5 rounded-xl hover:bg-accent/90 transition-all duration-200 min-h-[52px] disabled:opacity-50 disabled:cursor-not-allowed">
            <span id="verify-btn-text">Verify Document</span>
            <svg id="verify-spinner" class="w-5 h-5 animate-spin hidden" fill="none" viewBox="0 0 24 24" aria-hidden="true"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
          </button>
        </form>

        <!-- Result panel (hidden by default) -->
        <div id="verify-result" class="mt-6 hidden" role="alert" aria-live="polite">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </main>

  <footer class="py-6 text-center text-text-secondary text-xs border-t border-neutral-100">
    <p>© {{.CurrentYear}} {{.SchoolName}} · <a href="/" class="hover:text-primary transition-colors">Return to website</a></p>
  </footer>

  <script type="module">
    const form = document.getElementById('verify-form');
    const input = document.getElementById('doc-ref');
    const btn = document.getElementById('verify-btn');
    const btnText = document.getElementById('verify-btn-text');
    const spinner = document.getElementById('verify-spinner');
    const resultPanel = document.getElementById('verify-result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const ref = input.value.trim().toUpperCase();
      if (!ref) {
        input.focus();
        return;
      }

      btn.disabled = true;
      btnText.textContent = 'Verifying...';
      spinner.classList.remove('hidden');
      resultPanel.classList.add('hidden');

      try {
        const res = await fetch(`/api/verify?ref=${encodeURIComponent(ref)}`);
        const data = await res.json();

        if (data.verified) {
          resultPanel.innerHTML = `
            <div class="flex items-start gap-4 p-4 bg-success/10 border border-success/20 rounded-xl">
              <div class="flex-shrink-0 w-10 h-10 bg-success/20 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-success" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/></svg>
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2 mb-1">
                  <span class="font-semibold text-success text-sm">✓ VERIFIED</span>
                  <span class="bg-success/20 text-success text-xs font-mono px-2 py-0.5 rounded">${ref}</span>
                </div>
                <p class="text-sm text-text-primary font-medium">${data.doc_type?.replace(/_/g, ' ')}</p>
                <p class="text-sm text-text-secondary mt-1">Issued to: <strong>${data.student_name}</strong></p>
                <p class="text-sm text-text-secondary">Issued by: ${data.issued_by}</p>
                <p class="text-sm text-text-secondary">Date: ${data.generated_at}</p>
                <p class="text-xs text-text-secondary mt-2 opacity-70">Verified ${data.verified_count} time(s)</p>
              </div>
            </div>`;
        } else {
          resultPanel.innerHTML = `
            <div class="flex items-start gap-4 p-4 bg-danger/10 border border-danger/20 rounded-xl">
              <div class="flex-shrink-0 w-10 h-10 bg-danger/20 rounded-full flex items-center justify-center">
                <svg class="w-5 h-5 text-danger" fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
              </div>
              <div>
                <p class="font-semibold text-danger text-sm">✗ NOT FOUND</p>
                <p class="text-sm text-text-secondary mt-1">No document found with reference <strong class="font-mono">${ref}</strong>. Please check the reference number and try again.</p>
                <p class="text-xs text-text-secondary mt-2">If you believe this is an error, please contact the school directly.</p>
              </div>
            </div>`;
        }
        resultPanel.classList.remove('hidden');
      } catch {
        resultPanel.innerHTML = `<p class="text-danger text-sm text-center">Verification failed. Please try again.</p>`;
        resultPanel.classList.remove('hidden');
      } finally {
        btn.disabled = false;
        btnText.textContent = 'Verify Document';
        spinner.classList.add('hidden');
      }
    });

    // Auto-uppercase input
    input.addEventListener('input', () => {
      const pos = input.selectionStart;
      input.value = input.value.toUpperCase();
      input.setSelectionRange(pos, pos);
    });
  </script>
</body>
</html>
