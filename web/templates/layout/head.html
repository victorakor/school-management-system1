{{define "head"}}
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="theme-color" content="#0F2557" />
<title>{{if .Title}}{{.Title}} — {{end}}{{.SchoolName}}</title>
<meta name="description" content="{{.MetaDescription}}" />

<!-- CSRF token for JS fetch requests -->
<meta name="csrf-token" content="{{.CSRFToken}}" />

<!-- Preload critical fonts -->
<link rel="preload" href="/static/fonts/PlusJakartaSans-Bold.woff2" as="font" type="font/woff2" crossorigin />
<link rel="preload" href="/static/fonts/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin />

<!-- Compiled Tailwind CSS -->
<link rel="stylesheet" href="/static/css/app.css" />

<!-- Favicon -->
<link rel="icon" type="image/png" href="{{.SchoolLogoURL}}" />
{{end}}
