name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, staging]

jobs:
  # ─── Go: vet, build, test ────────────────────────────────────────────────────
  go:
    name: Go — vet / build / test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: school
          POSTGRES_PASSWORD: school
          POSTGRES_DB: school_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Build
        run: go build -v ./...

      - name: Test
        env:
          DATABASE_URL: postgres://school:school@localhost:5432/school_test?sslmode=disable
          REDIS_URL: localhost:6379
          JWT_SECRET: ci-test-jwt-secret-32-chars-min!!
          JWT_REFRESH_SECRET: ci-test-refresh-secret-32-chars!!
          CSRF_SECRET: ci-test-csrf-secret-32-chars-min!
          APP_BASE_URL: http://localhost:8080
          ENVIRONMENT: test
          RESEND_API_KEY: re_test_placeholder
          CLOUDINARY_CLOUD_NAME: test
          CLOUDINARY_API_KEY: test
          CLOUDINARY_API_SECRET: test
        run: go test -race -coverprofile=coverage.out ./...

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.out

  # ─── CSS: Tailwind build check ────────────────────────────────────────────────
  css:
    name: CSS — Tailwind build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run tailwind-build

      - name: Check CSS output exists
        run: test -f web/static/css/app.css && echo "✅ app.css built successfully"
